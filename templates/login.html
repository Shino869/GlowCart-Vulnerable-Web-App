{% extends 'base.html' %}
{% block title %}GlowCart | Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card p-4">
        <h2 class="fw-bold mb-4">Login</h2>
        <form method="post">
          <input type="hidden" name="next" value="{{ next_url }}">
          <div class="mb-3"><input class="form-control" name="identifier" placeholder="Username or Email" required></div>
          <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
          <button class="btn btn-primary w-100">Login</button>
        </form>
        <div class="mt-3 text-center">
          <a href="{{ url_for('main.forgot_password') }}">Forgot Password?</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
