{% extends 'base.html' %}
{% block title %}GlowCart | Register{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card p-4">
        <h2 class="fw-bold mb-4">Create your account</h2>
        <form method="post">
          <div class="mb-3"><input class="form-control" name="name" placeholder="Full Name" required></div>
          <div class="mb-3"><input class="form-control" name="username" placeholder="Username" required></div>
          <div class="mb-3"><input class="form-control" name="email" type="email" placeholder="Email Address" required></div>
          <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
          <div class="mb-3"><input class="form-control" name="phone" placeholder="Phone"></div>
          <div class="mb-3"><textarea class="form-control" name="address" placeholder="Address"></textarea></div>
          <button class="btn btn-primary w-100">Register</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
