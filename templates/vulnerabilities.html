<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm p-4">
      <h2 class="fw-bold mb-3">{{ title }}</h2>
      <div class="mb-3">{{ content|safe }}</div>
      {% if form_html %}
        <div>{{ form_html|safe }}</div>
      {% endif %}
      {% if extra %}
        <div class="mt-3">{{ extra|safe }}</div>
      {% endif %}
      <a href="{{ url_for('study_vulnerabilities') }}" class="btn btn-outline-secondary mt-3">Back to vulnerability list</a>
    </div>
  </div>
</body>
</html>
