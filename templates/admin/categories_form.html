{% extends 'admin/base.html' %}
{% block title %}Add Category{% endblock %}
{% block content %}
<div class="container py-4">
  <h3>Add Category</h3>
  <form method="post" class="row g-3">
    <div class="col-md-6"><input class="form-control" name="name" placeholder="Category Name" required></div>
    <div class="col-md-6"><input class="form-control" name="slug" placeholder="Slug" required></div>
    <div class="col-12"><textarea class="form-control" name="description" placeholder="Description"></textarea></div>
    <div class="col-12"><button class="btn btn-primary">Save Category</button></div>
  </form>
</div>
{% endblock %}
