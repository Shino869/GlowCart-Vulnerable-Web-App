{% extends 'admin/base.html' %}
{% block title %}Admin Uploads{% endblock %}
{% block content %}
<div class="container py-4">
  <h3>Uploads</h3>
  <table class="table table-bordered">
    <thead><tr><th>ID</th><th>Filename</th><th>Original Name</th></tr></thead>
    <tbody>
      {% for upload in uploads %}
      <tr><td>{{ upload.id }}</td><td>{{ upload.filename }}</td><td>{{ upload.original_name }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
