<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GlowCart Admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('admin.dashboard') }}">GlowCart Admin</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.products') }}">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.categories') }}">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.orders') }}">Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.users') }}">Manage Users</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.coupons') }}">Coupons</a></li>
      </ul>
      <a href="{{ url_for('admin.logout') }}" class="btn btn-light btn-sm">Logout</a>
    </div>
  </div>
</nav>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
