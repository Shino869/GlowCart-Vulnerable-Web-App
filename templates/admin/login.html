<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlowCart Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-4">
      <div class="card p-4 shadow">
        <h2 class="fw-bold mb-4">Admin Login</h2>
        <form method="post">
          <div class="mb-3"><input class="form-control" name="username" placeholder="Username or Email" required></div>
          <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
          <button class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
