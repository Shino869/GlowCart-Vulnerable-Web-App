{% extends 'base.html' %}
{% block title %}GlowCart | Contact{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card p-4">
        <h2 class="fw-bold mb-4">Contact GlowCart</h2>
        <form method="post" action="{{ url_for('main.contact_upload') }}" enctype="multipart/form-data">
          <div class="mb-3"><input class="form-control" name="name" placeholder="Name"></div>
          <div class="mb-3"><input class="form-control" name="email" placeholder="Email"></div>
          <div class="mb-3"><textarea class="form-control" name="message" rows="4" placeholder="How can we help?"></textarea></div>
          <label for="importData" class="form-label">
    Order / Request Reference
</label>
          <div class="input-group mb-3">
            <input
              type="text"
              class="form-control"
              id="importData"
              name="payload"
              placeholder="Enter reference information"
            >
            <button class="btn btn-outline-secondary" type="submit" formaction="{{ url_for('main.contact_import') }}" formmethod="get">Check Reference</button>
            
          </div>
          <button class="btn btn-primary">Send Message</button>
        </form>
        {% if deserialization_result %}
        <div class="alert alert-warning mt-3" role="alert">
          {{ deserialization_result }}
        </div>
        {% endif %}
        {% if diagnostic_output %}
        <pre class="mt-3 small text-muted">{{ diagnostic_output }}</pre>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
